<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="/popup/popup.css">
</head>
<body>
  <header>
    <h1 id="title" class="title">Small Memo</h1>
    <!-- <button id="setting" class="setting"><i class="fa-solid fa-gear"></i></button> -->
  </header>
  <main>
    <aside class="sidebar">
      <button id="newMemo" class="btn_new"><i class="fa-solid fa-plus"></i></button>
      <ul id="memoList" class="list">
      </ul>
    </aside>
    <article class="content">
      <div class="content__header">
        <input id="memoTitle" type="text" placeholder="title">
      </div>
      <div class="content__memo">
        <textarea class="memo" id="memo" placeholder="memo"></textarea>
      </div>
      <div class="content__date">
        <div class="date">created at: <br><span id="createdAt">12/23/2024 2:30PM</span></div>
        <div class="date">updated at: <br><span id="updatedAt">12/23/2024 2:33PM</span></div>
        <button id="delete"><i class="fa-solid fa-trash-can"></i></button>
      </div>
      <div id="deleteModal" class="modal">
        <div class="modal-content">
          <p>Delete this?</p>
          <button id="confirmDelete">Delete</button>
          <button id="cancelDelete">Cancel</button>
        </div>
      </div>
    </article>
  </main>

  <script src="/popup/popup.js"></script>
</body>
</html>
